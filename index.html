<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trackers</title>
<meta name="description" content="Choose a habit tracker — Memo or Beko.">
<meta name="theme-color" content="#1b5e20">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Trackers">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Trackers">
<meta property="og:description" content="Choose a habit tracker — Memo or Beko.">
<meta property="og:url" content="https://ahmedgebaly.github.io/Trackers/">
<meta property="og:image" content="https://ahmedgebaly.github.io/Trackers/og-image.jpg">
<meta property="og:image:alt" content="Trackers">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Trackers">
<meta name="twitter:description" content="Choose a habit tracker — Memo or Beko.">
<meta name="twitter:image" content="https://ahmedgebaly.github.io/Trackers/og-image.jpg">

<style>
  :root{
    --gold:#e8c46b;
    --green:#1b5e20;
    --green-hover:#2e7d32;
    --pink:#e91e8c;
    --pink-hover:#f062ab;
    --lightgreen:#81c784;
    --bg1:#fdf6e3;
    --bg2:#f4e6b8;
    --bg-peach:#f7d9c4;
    --bg-lavender:#e4d4f5;
    --text:#3a3a2a;
    --text-dark:#3a2e10;
    --radius-glass:16px;
    --shadow:0 4px 15px rgba(0,0,0,0.1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    background-color:var(--bg1);
    background-image:
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(228,212,245,0.7), transparent 55%),
      radial-gradient(ellipse 70% 50% at 90% 15%, rgba(247,217,196,0.75), transparent 50%),
      radial-gradient(ellipse 60% 45% at 50% 85%, rgba(232,196,107,0.35), transparent 55%),
      linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg-peach) 100%);
    background-attachment:fixed;
  }
  .chooser{
    width:100%;
    max-width:720px;
    text-align:center;
  }
  .chooser h1{
    margin:0 0 8px;
    font-size:clamp(1.75rem, 4vw, 2.4rem);
    color:var(--text-dark);
    font-weight:700;
  }
  .chooser p{
    margin:0 0 32px;
    font-size:1.05rem;
    opacity:0.85;
  }
  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  .choice{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:180px;
    padding:28px 20px;
    text-decoration:none;
    color:#fff;
    border-radius:var(--radius-glass);
    border:1px solid rgba(255,255,255,0.35);
    box-shadow:
      var(--shadow),
      inset 0 1px 1px rgba(255,255,255,0.35);
    transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, filter 0.2s ease;
  }
  .choice--beko{
    background:linear-gradient(145deg, var(--green-hover) 0%, var(--green) 100%);
  }
  .choice--memo{
    background:linear-gradient(145deg, var(--pink-hover) 0%, var(--pink) 100%);
  }
  .choice:hover,
  .choice:focus-visible{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 10px 28px rgba(0,0,0,0.2);
    outline:none;
    filter:brightness(1.08);
  }
  .choice--beko:focus-visible{
    box-shadow:0 0 0 3px var(--lightgreen), 0 10px 28px rgba(0,0,0,0.2);
  }
  .choice--memo:focus-visible{
    box-shadow:0 0 0 3px #f8bbd0, 0 10px 28px rgba(0,0,0,0.2);
  }
  .choice-label{
    font-size:clamp(1.6rem, 4vw, 2.2rem);
    font-weight:700;
    letter-spacing:0.02em;
    color:#fff;
  }
  .choice-sub{
    font-size:0.95rem;
    opacity:0.9;
    color:#fff;
  }
  @media (max-width:560px){
    .choices{grid-template-columns:1fr;}
    .choice{min-height:140px;}
  }
  @media (prefers-reduced-motion:reduce){
    .choice{transition:none;}
    .choice:hover,.choice:focus-visible{transform:none;}
  }
</style>
</head>
<body>
  <main class="chooser">
    <h1>Trackers</h1>
    <p>Choose whose tracker to open</p>
    <div class="choices">
      <a class="choice choice--memo" href="memo.html">
        <span class="choice-label">Memo</span>
        <span class="choice-sub">Memo Tracker</span>
      </a>
      <a class="choice choice--beko" href="beko.html">
        <span class="choice-label">Beko</span>
        <span class="choice-sub">Beko Tracker</span>
      </a>
    </div>
  </main>
</body>
</html>
